name: Refresh detailed game data

on:
  schedule:
    # Keep backfilling twenty games per run; current-price publication is separate.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      appids:
        description: '优先采集指定 Steam AppID（最多 10 个）；留空执行常规轮换'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: steam-price-radar-pages
  cancel-in-progress: false
  queue: max

jobs:
  details:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Checkout saved game details
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify price matching safeguards
        run: python -m unittest discover -s tests -v
      - name: Collect a rotating detail batch
        env:
          REQUESTED_APPIDS: ${{ inputs.appids || '' }}
        run: |
          if [ -n "$REQUESTED_APPIDS" ]; then
            python scripts/refresh_prices.py --appids "$REQUESTED_APPIDS"
          else
            python scripts/refresh_prices.py --batch-size 20
          fi
      - name: Validate prices and website
        run: node scripts/check_site.mjs
      - name: Save detailed data
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- dist/data/prices.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: refresh detailed game data'
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
