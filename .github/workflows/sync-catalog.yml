name: Sync game catalog and deploy

on:
  schedule:
    # One catalog batch per day; an API key enables the official full directory.
    - cron: '19 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: steam-price-radar-pages
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: read
    steps:
      - name: Checkout latest directory
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Verify catalog and price matching
        run: python -m unittest discover -s tests -v
      - name: Sync next directory batch
        env:
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}
        run: python scripts/sync_catalog.py --pages 30
      - name: Validate website and catalog
        run: node scripts/check_site.mjs
      - name: Save updated directory
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git add -- dist/data/catalog-index.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'data: sync Steam game directory'
            git push origin "HEAD:$DEFAULT_BRANCH"
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy updated catalog
        id: deployment
        uses: actions/deploy-pages@v4
